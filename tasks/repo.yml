---
- name: set apt preferences
  copy:
    src: preferences.conf
    dest: /etc/apt/preferences.d/php-preferences
    owner: root
    group: root
    mode: "0644"

- name: install apt-transport-https
  apt:
    name: apt-transport-https
    state: present

- name: add Sury apt repository key
  ansible.builtin.get_url:
    url: "https://packages.sury.org/php/apt.gpg"
    dest: "/usr/share/keyrings/deb.sury.org-php.gpg"
    mode: '0644'
    force: true
  when: ansible_distribution_version is version_compare('10', '>=')

- name: add Sury repo
  apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main"
    update_cache: true
